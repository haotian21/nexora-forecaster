name: Tests

# Runs the offline test suite (no API keys, no network calls to LLMs) on every push,
# so a broken edit is caught before the scheduled bot uses it.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest -q
