[project]
name = "nexora-forecaster"
version = "0.1.0"
description = "Claude-led forecasting bot for the Metaculus FutureEval bot tournaments (Fall 2026 + MiniBench)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "forecasting-tools>=0.3.1,<0.4",
    "numpy>=2.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
